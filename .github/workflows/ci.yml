name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build
        run: npm run build
        env:
          # A placeholder key is enough: build only needs the variable to
          # exist, not to be valid, since no API call happens at build time.
          GOOGLE_GENERATIVE_AI_API_KEY: ci-placeholder-key

      - name: Run tests with coverage
        run: npm run test:coverage
